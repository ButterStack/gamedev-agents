name: Lint plugins

# Static validation that the plugins stay in spec. No API key or `claude` login is
# needed - `claude plugin validate` is an offline manifest/schema check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI (provides `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code

      - name: Ensure shellcheck is available
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Lint plugins
        run: ./scripts/lint-plugins.sh
